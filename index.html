<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corny | DevSecOps & Autonomous Systems Architect</title>
    <style>
        :root {
            --bg-main: #06090e;
            --bg-card: #0d1117;
            --bg-terminal: #090d13;
            --accent-cyan: #00f0ff;
            --accent-green: #39ff14;
            --text-main: #8b949e;
            --text-bright: #f0f6fc;
            --border-muted: #21262d;
            --border-glow: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;

        }

        /* Moving Wallpaper Canvas */
        #wallpaper-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        header {
            background-color: rgba(13, 17, 23, 0.85);
            border-bottom: 1px solid var(--border-muted);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-bright);
            text-decoration: none;
            letter-spacing: 1px;
            font-family: monospace;
        }

        .logo span {
            color: var(--accent-cyan);
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 1.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
        }

        main {
            max-width: 1100px;
            margin: 120px auto 0 auto;
            padding: 0 2rem;
            box-sizing: border-box;
        }

        section {
            padding: 3.5rem 0;
            background: transparent;
        }

        /* Hero Styling */
        .hero {
            padding: 2rem 0 4rem 0;
        }

        h1 {
            font-size: 3rem;
            color: var(--text-bright);
            margin: 0 0 0.5rem 0;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--accent-cyan);
        }

        .subtitle {
            font-size: 1.3rem;
            color: var(--text-bright);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .lead-text {
            font-size: 1.1rem;
            max-width: 850px;
            color: var(--text-main);
        }

        .meta-links {
            margin-top: 1.5rem;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .meta-links a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        /* Terminal Component */
        .terminal-block {
            background-color: var(--bg-terminal);
            border: 1px solid var(--border-glow);
            border-radius: 6px;
            padding: 1.5rem;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.85rem;
            color: #c9d1d9;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }

        .terminal-header {
            color: var(--accent-cyan);
            margin-bottom: 0.75rem;
            font-weight: bold;
        }

        .terminal-grid {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .terminal-grid th, .terminal-grid td {
            text-align: left;
            padding: 0.4rem 0.75rem;
            border-bottom: 1px dashed #21262d;
        }

        .terminal-grid th {
            color: var(--text-bright);
            border-bottom: 1px solid var(--border-glow);
        }

        .check-complete {
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Section Headings */
        h2 {
            font-size: 1.75rem;
            color: var(--text-bright);
            margin-top: 0;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
        }

        h2::after {
            content: '';
            flex-grow: 1;
            margin-left: 1.25rem;
            height: 1px;
            background: var(--border-muted);
        }

        /* Architecture Pillars */
        .pillar-layout {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .pillar-card {
            background-color: rgba(13, 17, 23, 0.7);
            border: 1px solid var(--border-muted);
            border-radius: 8px;
            padding: 2.5rem;
            position: relative;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .pillar-card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .pillar-title {
            font-size: 1.45rem;
            color: var(--text-bright);
            margin: 0;
            font-weight: 700;
        }

        .skill-metric {
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-elite {
            background-color: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .metric-mastery {
            background-color: rgba(57, 255, 20, 0.08);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .pillar-label {
            font-size: 1rem;
            color: var(--text-bright);
            margin-bottom: 1.5rem;
            font-style: italic;
            border-left: 2px solid var(--border-glow);
            padding-left: 1rem;
        }

        .pillar-body {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .bullet-pipeline {
            margin: 1.5rem 0 0 0;
            padding-left: 1.25rem;
        }

        .bullet-pipeline li {
            margin-bottom: 0.85rem;
            color: var(--text-main);
        }

        .bullet-pipeline strong {
            color: var(--text-bright);
            font-weight: 600;
        }

        /* Form Configuration */
        form {
            background-color: rgba(13, 17, 23, 0.75);
            border: 1px solid var(--border-muted);
            padding: 2.5rem;
            border-radius: 8px;
            max-width: 650px;
            margin: 0 auto;
            backdrop-filter: blur(4px);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-bright);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            color: var(--text-bright);
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        .btn-submit {
            background-color: transparent;
            border: 1px solid var(--border-glow);
            color: var(--accent-cyan);
            width: 100%;
            justify-content: center;
            font-size: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: rgba(0, 240, 255, 0.05);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        footer {
            text-align: center;
            padding: 4rem 2rem;
            color: #484f58;
            font-size: 0.85rem;
            border-top: 1px solid var(--border-muted);
            margin-top: 5rem;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.25rem; }
            .nav-links { display: none; }
            .pillar-card { padding: 1.75rem; }
        }
     }
</style>
</head>
<body>

<!-- Dynamic Moving Wallpaper Base Component -->
<canvas id="wallpaper-canvas"></canvas>



    <header>
        <nav class="nav-container">
            <a href="#" class="logo">CORNY<span>//</span>STUDIO</a>
                  <div class="nav-links">
        </div>
    </nav>
</header>

<script src="./script.js"></script>
</body>
</html>
