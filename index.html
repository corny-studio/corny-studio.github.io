<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corny | DevSecOps & Autonomous Systems Architect</title>
    <style>
        :root {
            --bg-main: #06090e; --bg-card: #0d1117; --bg-terminal: #090d13;
            --accent-cyan: #00f0ff; --accent-green: #39ff14;
            --text-main: #8b949e; --text-bright: #f0f6fc;
            --border-muted: #21262d; --border-glow: #30363d;
        }
        html { background-color: var(--bg-main); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: transparent; color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; overflow-x: hidden; position: relative; }

        #wallpaper-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        header { background-color: rgba(13, 17, 23, 0.85); border-bottom: 1px solid var(--border-muted); position: fixed; width: 100%; top: 0; z-index: 1000; backdrop-filter: blur(12px); }
        .nav-container { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; box-sizing: border-box; }
        .brand { display: flex; align-items: center; gap: 0.75rem; }
        .brand span { font-size: 1.1rem; font-weight: 800; color: var(--text-bright); font-family: monospace; letter-spacing: 1px; }

        main { max-width: 1100px; margin: 100px auto 0 auto; padding: 0 2rem; box-sizing: border-box; }
        section { padding: 3.5rem 0; background: transparent; }

        .hero { padding: 1.5rem 0 1rem 0; }
        .hero a { text-decoration: none; cursor: default; -webkit-user-select: none; user-select: none; }
        h1 { font-size: 3.2rem; color: var(--text-bright); margin: 0 0 0.25rem 0; font-weight: 800; letter-spacing: -0.75px; }
        h1 span { color: var(--accent-cyan); }
        .subtitle { font-size: 1.05rem; color: var(--accent-cyan); font-family: monospace; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 1.5rem; }

        .terminal-block { background-color: var(--bg-terminal); border: 1px solid var(--border-glow); border-radius: 6px; padding: 1.5rem; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 0.85rem; color: #c9d1d9; overflow-x: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 2rem; }
        .terminal-header { color: var(--accent-cyan); margin-bottom: 0.75rem; font-weight: bold; }
        .terminal-grid { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        .terminal-grid th, .terminal-grid td { text-align: left; padding: 0.4rem 0.75rem; border-bottom: 1px dashed #21262d; }
        .terminal-grid th { color: var(--text-bright); border-bottom: 1px solid var(--border-glow); }
        .demo-line { font-size: 0.8rem; color: var(--text-main); margin-top: 0.5rem; }
        #activity-log { border-top: 1px dashed var(--border-muted); padding-top: 0.5rem; min-height: 7.5em; color: var(--accent-green); }

        .links-hub { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
        .hub-btn { display: inline-flex; align-items: center; gap: 0.6rem; background-color: var(--bg-card); border: 1px solid var(--border-muted); color: var(--text-bright); padding: 0.65rem 1.25rem; border-radius: 6px; font-family: monospace; font-size: 0.85rem; text-decoration: none; transition: all 0.2s ease; }
        .hub-btn:hover { border-color: var(--accent-cyan); box-shadow: 0 0 12px rgba(0,240,255,0.15); color: var(--accent-cyan); transform: translateY(-2px); }
        nav { display: flex; align-items: center; gap: 0.75rem; }
        .hub-btn.small { padding: 0.5rem 1rem; font-size: 0.8rem; }
        .hub-btn svg { width: 14px; height: 14px; color: var(--accent-cyan); }
        .hub-btn.discord-main { border-color: rgba(114,137,218,0.4); }
        .hub-btn.discord-main:hover { border-color: #7289da; box-shadow: 0 0 12px rgba(114,137,218,0.25); color: #7289da; }

        .asset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 1.5rem; }
        .project-meta { margin-top: 1rem; display: flex; gap: 0.5rem; font-family: monospace; font-size: 0.75rem; }
        .lang-badge { background: rgba(255,255,255,0.05); padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid var(--border-muted); }

        h2 { font-size: 1.75rem; color: var(--text-bright); margin-top: 0; margin-bottom: 2.5rem; display: flex; align-items: center; }
        h2::after { content: ''; flex-grow: 1; margin-left: 1.25rem; height: 1px; background: var(--border-muted); }

        .pillar-card { background-color: rgba(13,17,23,0.7); border: 1px solid var(--border-muted); border-radius: 8px; padding: 2.5rem; position: relative; backdrop-filter: blur(4px); transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        .pillar-card:hover { border-color: var(--border-glow); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

        .badges-section { width: 100%; margin-bottom: 2rem; }
        .badge-container { display: flex; gap: 1rem; width: 100%; flex-wrap: wrap; }
        .mini-badge { background: var(--bg-card); border: 1px solid var(--border-muted); border-radius: 6px; display: flex; align-items: center; padding: 0.6rem 1rem; flex: 1 1 260px; transition: border-color 0.2s ease, transform 0.2s ease; }
        .mini-badge:hover { border-color: var(--accent-cyan); transform: translateY(-2px); }
        .badge-icon { width: 18px; height: 18px; margin-right: 0.75rem; }
        .elite .badge-icon { color: #8b5cf6; } .expert .badge-icon { color: var(--accent-green); }
        .badge-info { display: flex; flex-direction: column; }
        .badge-title { font-size: 0.85rem; font-weight: 600; color: var(--text-bright); }
        .badge-status { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }
        .elite .badge-status { color: #8b5cf6; } .expert .badge-status { color: var(--accent-green); }

        .status-idle { color: var(--text-main); }
        .status-online { color: var(--accent-green); font-weight: bold; }
        .status-active { color: var(--accent-cyan); font-weight: bold; }

        .top-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 1.25rem 0; }
        .chip { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.3rem 0.75rem 0.3rem 0.55rem; background: rgba(13,17,23,0.8); border: 1px solid var(--border-muted); border-radius: 999px; font-size: 0.78rem; text-decoration: none; color: var(--text-bright); transition: border-color 0.2s ease, transform 0.2s ease; }
        .chip:hover, .chip:focus-visible { border-color: var(--accent-cyan); transform: translateY(-1px); outline: none; }
        .chip-icon { width: 15px; height: 15px; flex: none; }
        .chip-name { font-weight: 600; }
        .chip-level { font-style: normal; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; }
        .chip.elite .chip-icon, .chip.elite .chip-level { color: #8b5cf6; }
        .chip.expert .chip-icon, .chip.expert .chip-level { color: var(--accent-green); }
        .chip.proficient .chip-icon, .chip.proficient .chip-level { color: var(--accent-cyan); }
        .chip.hands-on .chip-icon, .chip.hands-on .chip-level { color: #f5b83d; }
        .proficient .badge-icon, .proficient .badge-status { color: var(--accent-cyan); }
        .hands-on .badge-icon, .hands-on .badge-status { color: #f5b83d; }
        .badge-note { font-size: 0.72rem; color: var(--text-main); margin-top: 2px; line-height: 1.4; }

        .mon-link { color: inherit; text-decoration: none; border-bottom: 1px dotted transparent; transition: color 0.15s ease, border-color 0.15s ease; }
        .mon-link:hover, .mon-link:focus-visible { color: var(--accent-cyan); border-bottom-color: currentColor; outline: none; }
    </style>
    <script src="https://cloudflare.com"></script>
</head>

    <main>

                <div id="activity-log">> Background logic updated. Tracking viewport dimensions...</div>
