<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corny Studio // Access Control Core</title>
    
    <!-- Load TradingView Script Library Early -->
    <script type="text/javascript" src="https://tradingview.com" charset="utf-8"></script>

    <!-- 🧠 CORE INTERACTIVE WORKSPACE ENGINE -->
    <script type="text/javascript">
        let currentUserRole = "GUEST";
        const activePipelines = { trade: false, code: false };
        let consoleLogsInterval = null;

        // PRIVATE SYSTEM MASTER PASSWORD LOCK
        const ADMIN_CORE_SECRET = "CornyStudioSecureCore2026"; 

        function processLoginSequence() {
            const inputField = document.getElementById("pass-input");
            const inputVal = inputField.value.trim();
            
            const badge = document.getElementById("role-badge");
            const status = document.getElementById("status-indicator");
            
            if (inputVal.toLowerCase() === "guest") {
                currentUserRole = "GUEST";
                badge.innerText = "ROLE: DEFAULT_GUEST";
                badge.style.color = "#85929E";
                status.innerText = "● GUEST SANDBOX ACTIVE";
                status.style.color = "#f59e0b";
                
                document.getElementById("code-btn").classList.add("btn-disabled");
                document.getElementById("code-widget-desc").innerText = "• Requires higher workspace clearance.";
                
                initializeDashboardLayout();
                logToTerminal("sys", "Handshake authorized under guest profile. Advanced administrative logic is masked.");
                
            } else if (inputVal === ADMIN_CORE_SECRET) {
                currentUserRole = "ADMIN";
                badge.innerText = "ROLE: MASTER_ADMIN";
                badge.style.color = "#c5a5c5";
                status.innerText = "● LOCAL EMULATOR SAFE";
                status.style.color = "#66fcf1";
                
                initializeDashboardLayout();
                logToTerminal("sys", "Secure admin key signature verified. Full core authorization unlocked.");
            } else {
                alert("ACCESS REDIRECT: Invalid credential string pattern.");
                inputField.value = "";
            }
        }

        function initializeDashboardLayout() {
            document.getElementById("auth-gate").style.display = "none";
            document.getElementById("dashboard-core").style.display = "grid";
            
            // Draw charts immediately upon entering dashboard layout
            renderTradingViewCharts();
        }

        function renderTradingViewCharts() {
            try {
                if (typeof TradingView !== 'undefined') {
                    new TradingView.MediumWidget({
                        "container_id": "tradingview_btc",
                        "symbols": [["Bitcoin / US Dollar", "BINANCE:BTCUSDT|1D"]],
                        "chartOnly": false, "width": "100%", "height": "100%", "locale": "en", "colorTheme": "dark", "autosize": true, "showVolume": false, "hideDateProperties": false, "hideMarketStatus": false, "hideSymbolLogo": false, "scalePosition": "right", "scaleMode": "Normal", "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif", "underlineColor": "rgba(102, 252, 241, 0.15)", "gridLineColor": "rgba(42, 46, 57, 0.3)", "trendLineColor": "#66fcf1", "fontColor": "#787b86"
                    });

                    new TradingView.MediumWidget({
                        "container_id": "tradingview_mgc",
                        "symbols": [["Micro Gold Futures", "COMEX:MGC1!|1D"]],
                        "chartOnly": false, "width": "100%", "height": "100%", "locale": "en", "colorTheme": "dark", "autosize": true, "showVolume": false, "hideDateProperties": false, "hideMarketStatus": false, "hideSymbolLogo": false, "scalePosition": "right", "scaleMode": "Normal", "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif", "underlineColor": "rgba(102, 252, 241, 0.15)", "gridLineColor": "rgba(42, 46, 57, 0.3)", "trendLineColor": "#f59e0b", "fontColor": "#787b86"
                    });
                }
            } catch (e) {
                console.log("Chart rendering deferred safely:", e);
            }
        }

        function togglePipeline(id, name) {
            if (currentUserRole === "GUEST" && id === "code") {
                logToTerminal("sys", "ACCESS EXCEPTION: Guest profile is unauthorized to call external language model loops.");
                return;
            }
            
            const btn = document.getElementById(`${id}-btn`);
            activePipelines[id] = !activePipelines[id];
            
            if (activePipelines[id]) {
                btn.innerText = `■ Terminate ${name}`;
                btn.classList.add("active");
                logToTerminal("sys", `Spinning up processing matrix for: ${name}...`);
                
                if (id === "trade") triggerTelemetryStream(true);
                if (id === "code") logToTerminal("code", "Claude Engine online. Crawling local staging directories for security verification checks...");
            } else {
                btn.innerText = `▶ Launch ${name}`;
                btn.classList.remove("active");
                logToTerminal("sys", `Pipeline thread forced down to rest: ${name}`);
                
                if (id === "trade") triggerTelemetryStream(false);
            }
        }

        function triggerTelemetryStream(start) {
            if (!start) {
                clearInterval(consoleLogsInterval);
                logToTerminal("trade", "Quantitative dashboard stream detached.");
                return;
            }
            
            const guestPhrases = [
                "[SANDBOX] Simulating market ticker data capture... Values read-only.",
                "[SANDBOX] Parsing fake market volatility matrix... No real accounts linked.",
                "[SANDBOX] Heartbeat stable. Chart telemetry running smoothly."
            ];
            
            const adminPhrases = [
                "[LIVE_CORE] Telemetry check: BINANCE:BTCUSDT data streams fully active.",
                "[LIVE_CORE] Telemetry check: COMEX:MGC1! futures connection operating normally.",
                "[LIVE_CORE] Port evaluation clear. Ready for programmatic overrides."
            ];
            
            const logPool = (currentUserRole === "ADMIN") ? adminPhrases : guestPhrases;
            
            consoleLogsInterval = setInterval(() => {
                if (activePipelines.trade) {
                    const randomMsg = logPool[Math.floor(Math.random() * logPool.length)];
                    logToTerminal("trade", randomMsg);
                }
            }, 5000);
        }

        function logToTerminal(type, text) {
            const stream = document.getElementById("console-stream");
            if (!stream) return;
            
            const line = document.createElement("div");
            const time = new Date().toTimeString().split(' ');
            
            line.className = `terminal-line ${type}`;
            line.innerHTML = `<span class="stamp">[${time}]</span>${type.toUpperCase()}: ${text}`;
            stream.appendChild(line);
            stream.scrollTop = stream.scrollHeight;
        }

        function clearConsoleLog() {
            document.getElementById("console-stream").innerHTML = "";
            logToTerminal("sys", "Terminal view cache wiped clean.");
        }

        function handleCommand(e) {
            if (e.key === "Enter") {
                const input = document.getElementById("console-cmd");
                const val = input.value.trim();
                if (!val) return;
                
                if (currentUserRole === "GUEST") {
                    logToTerminal("sys", `GUEST INTERCEPT: Command payload ignored. Guests lack manual pipeline execution rights.`);
                } else {
                    logToTerminal("sys", `Admin execution command pushed to stream: "${val}"`);
                }
                input.value = "";
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0c10; color: #66fcf1; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; padding: 20px; }
        
        /* Gateway Lock Screen */
        #auth-gate { text-align: center; border: 1px solid #1f2833; padding: 40px; background: #151a21; border-radius: 4px; box-shadow: 0 0 20px rgba(102,252,241,0.1); width: 360px; display: block; }
        #auth-gate h2 { margin-bottom: 15px; font-size: 1.2rem; letter-spacing: 1px; color: #c5a5c5; }
        #auth-gate p { font-size: 0.75rem; color: #85929E; margin-bottom: 20px; line-height: 1.4; }
        #pass-input { background: #0b0c10; border: 1px solid #66fcf1; color: #fff; padding: 12px; font-size: 0.95rem; width: 100%; text-align: center; margin-bottom: 15px; border-radius: 4px; outline: none; }
        #auth-btn { background: #66fcf1; border: none; color: #0b0c10; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%; letter-spacing: 1px; }
        #auth-btn:hover { background: #45f3ff; box-shadow: 0 0 10px #45f3ff; }
        
        /* Master Dashboard Panel Framework */
        #dashboard-core { display: none; width: 100%; max-width: 1400px; height: 90vh; grid-template-rows: auto 1fr; gap: 20px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2833; padding-bottom: 12px; }
