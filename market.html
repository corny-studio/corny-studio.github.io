<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market | CORNY//STUDIO</title>
    <style>
        :root {
            --bg-main: #06090e; --bg-card: #0d1117;
            --accent-cyan: #00f0ff; --accent-green: #39ff14;
            --text-main: #8b949e; --text-bright: #f0f6fc;
            --border-muted: #21262d; --border-glow: #30363d;
        }
        * { box-sizing: border-box; }
        html { background-color: var(--bg-main); }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        #wallpaper-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(13,17,23,0.85); border-bottom: 1px solid var(--border-muted); backdrop-filter: blur(12px); }
        .nav { max-width: 1100px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .brand { font: 800 1.1rem monospace; letter-spacing: 1px; color: var(--text-bright); text-decoration: none; }
        .nav-links { display: flex; gap: 0.75rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-muted); color: var(--text-bright); padding: 0.5rem 1rem; border-radius: 6px; font: 0.8rem monospace; text-decoration: none; transition: all 0.2s ease; }
        .btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn.current { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn svg { width: 14px; height: 14px; }

        main { max-width: 1100px; margin: 0 auto; padding: 110px 2rem 4rem; }
        h1 { margin: 0 0 0.25rem; font: 800 2rem monospace; color: var(--text-bright); }
        .lead { margin: 0 0 2rem; font-size: 0.95rem; }

        #filters { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 2rem; }
        .filter { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-muted); padding: 0.5rem 1rem; border-radius: 4px; font: 0.8rem monospace; cursor: pointer; }
        .filter.active { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); font-weight: bold; }
        #market-empty { display: none; font-family: monospace; }

        #market-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border-muted); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .card-media { height: 240px; border-bottom: 1px solid var(--border-muted); overflow: hidden; background: #0a0e14; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(0.95); }
        .img-missing { height: 100%; display: flex; align-items: center; justify-content: center; font: 0.8rem monospace; }
        .card-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; flex-grow: 1; }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
        .card-top h3 { margin: 0; font: 1.2rem monospace; color: var(--text-bright); }
        .price { white-space: nowrap; background: rgba(0,240,255,0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font: bold 0.8rem monospace; padding: 0.2rem 0.5rem; border-radius: 4px; }
        .tag { align-self: flex-start; font: bold 0.7rem monospace; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); background: rgba(0,240,255,0.05); padding: 0.2rem 0.5rem; border-radius: 4px; }
        .desc { margin: 0; font-size: 0.85rem; line-height: 1.5; }
        .facts { margin-top: auto; border-top: 1px dashed var(--border-muted); padding-top: 1rem; font: 0.8rem monospace; display: grid; gap: 0.5rem; }
        .fact strong { color: var(--text-bright); }
        .buy { display: flex; justify-content: center; margin-top: 0.75rem; background: var(--bg-main); border: 1px solid var(--border-muted); color: var(--text-bright); text-decoration: none; padding: 0.65rem; border-radius: 6px; font-weight: bold; }
        .buy:hover { border-color: var(--accent-green); color: var(--accent-green); }

        [hidden] { display: none !important; }
        .danger { background: transparent; border: 1px solid #5a2a35; color: #ff5c7a; border-radius: 6px; padding: 0.5rem; font: 0.8rem monospace; cursor: pointer; margin-top: 0.5rem; }
        .danger:hover { border-color: #ff5c7a; }

        #admin-panel { background: var(--bg-card); border: 1px solid var(--accent-cyan); border-radius: 8px; padding: 1.5rem; margin-bottom: 2.5rem; }
        #admin-panel h2 { margin: 0 0 0.25rem; font: 1.1rem monospace; color: var(--accent-cyan); }
        #admin-panel .note { margin: 0 0 1.25rem; font-size: 0.8rem; }
        .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0.85rem; }
        .fields .wide { grid-column: 1 / -1; }
        .fields label { display: grid; gap: 0.3rem; font: 0.75rem monospace; color: var(--text-bright); }
        .fields input, .fields textarea { background: var(--bg-main); border: 1px solid var(--border-glow); color: #fff; border-radius: 4px; padding: 0.6rem; font: 0.85rem monospace; outline: none; width: 100%; }
        .fields input:focus, .fields textarea:focus { border-color: var(--accent-cyan); }
        .form-actions { display: flex; align-items: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .primary { background: var(--accent-cyan); color: #000; border: none; border-radius: 6px; padding: 0.65rem 1.25rem; font: bold 0.85rem monospace; cursor: pointer; }
        #form-msg { font: 0.8rem monospace; }
        #form-msg.good { color: var(--accent-green); }
        #form-msg.bad { color: #ff5c7a; }
        #code-out { margin-top: 1rem; }
        #code-text { width: 100%; height: 190px; background: var(--bg-main); color: #c9d1d9; border: 1px solid var(--border-glow); border-radius: 4px; padding: 0.6rem; font: 0.78rem monospace; }

        @media (max-width: 640px) { .nav { padding: 0.75rem 1rem; } main { padding: 100px 1rem 3rem; } }
    </style>
</head>
<body>
    <canvas id="wallpaper-canvas"></canvas>

    <header>
        <div class="nav">
            <a class="brand" href="index.html">CORNY//GAMES</a>
            <nav class="nav-links">
                <a class="btn" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    Home
                </a>
                <a class="btn current" href="market.html" aria-current="page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    Studio Market
                </a>
                <span id="auth-slot"></span>
            </nav>
        </div>
    </header>

    <main>
        <h1>// CORNY_STUDIO_MARKET</h1>
        <p class="lead">Assets and tools built in the studio.</p>
        <section id="admin-panel" hidden>
            <h2>Add market item</h2>
            <p class="note">Only visible while logged in as master. With the relay connected, items publish instantly for everyone.</p>
            <form id="item-form" autocomplete="off">
                <div class="fields">
                    <label>Name *<input id="f-name" maxlength="80" required></label>
                    <label>Price * (e.g. R$ 500)<input id="f-price" maxlength="30" required></label>
                    <label>Category<input id="f-cat" maxlength="30" placeholder="Models"></label>
                    <label>Status line<input id="f-status" maxlength="80" placeholder="Immediate Asset ID Delivery"></label>
                    <label class="wide">Description *<textarea id="f-desc" rows="3" maxlength="600" required></textarea></label>
                    <label class="wide">Rights<input id="f-rights" maxlength="300"></label>
                    <label class="wide">Fulfillment<input id="f-fulfillment" maxlength="300"></label>
                    <label class="wide">Contact<input id="f-contact" maxlength="300"></label>
                    <label>Image (https link or repo file)<input id="f-img" maxlength="500" placeholder="fountain.png"></label>
                    <label>Buy / view link (https)<input id="f-link" maxlength="500" placeholder="https://www.roblox.com/..."></label>
                    <label>Button text<input id="f-linklabel" maxlength="60" placeholder="View on Roblox"></label>
                </div>
                <div class="form-actions">
                    <button class="primary" type="submit">Add item</button>
                    <span id="form-msg" role="status"></span>
                </div>
            </form>
            <div id="code-out" hidden>
                <textarea id="code-text" readonly aria-label="Code to paste into market.js"></textarea>
                <button class="filter" id="copy-code" type="button">Copy code</button>
            </div>
        </section>

        <div id="filters"></div>
        <p id="market-empty">Nothing in this category yet.</p>
        <div id="market-grid"></div>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="market.js"></script>
    <script src="script.js"></script>
</body>
</html>
