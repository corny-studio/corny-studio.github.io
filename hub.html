<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORNY//STUDIO · Roblox Hub</title>
<style>
:root{
  --bg:#06080c; --panel:#0c1118; --line:#1a2432; --text:#cfe6f2; --dim:#6b8294;
  --cyan:#19f3ff; --mag:#ff2bd6; --ok:#3dff9a; --warn:#ffc83d;
  --ui:"Segoe UI",system-ui,sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:var(--ui)}
body{background:transparent}      /* space-bg.js puts the animated space behind the page; html keeps a solid colour so there is never a white flash */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(6,8,12,.30)}      /* a soft dimmer between the space and the panels: raise .30 to make it darker */
body{padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));min-height:100vh}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:14px}
h1{margin:0;font-size:22px;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 14px rgba(25,243,255,.55)}
h1 span{color:var(--mag);text-shadow:0 0 14px rgba(255,43,214,.55)}
.badge{font:12px var(--mono);padding:3px 9px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.badge.admin{color:var(--ok);border-color:var(--ok)} .badge.guest{color:var(--warn);border-color:var(--warn)}
.badge.live{color:var(--ok);border-color:var(--ok)} .badge.sim{color:var(--mag);border-color:var(--mag)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.tile{background:rgba(12,17,24,.78);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.tile b{display:block;font:600 24px var(--mono);color:var(--cyan)}
.tile small{color:var(--dim);font-size:12px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}
.box{background:rgba(12,17,24,.78);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-height:0}
.box h2{margin:0;padding:9px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);color:var(--dim);display:flex;justify-content:space-between;gap:8px}
#hub-log{font:12.5px/1.55 var(--mono);height:360px;overflow:auto;padding:8px 12px;margin:0}
#hub-log div{white-space:pre-wrap;word-break:break-word}
.t-join{color:var(--ok)} .t-leave{color:var(--dim)} .t-purchase{color:var(--mag)} .t-economy{color:var(--cyan)}
.t-rank{color:var(--warn)} .t-asset{color:#9db8ff} .t-agent{color:#fff} .t-sys{color:var(--dim)}
.agents{padding:10px;display:grid;gap:8px}
.agent{border:1px solid var(--line);border-radius:4px;padding:9px 10px}
.agent p{margin:2px 0 8px;color:var(--dim);font-size:12.5px}
.agent .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agent strong{font-size:14px}
.st{font:11px var(--mono);color:var(--dim)} .st.run{color:var(--warn)} .st.done{color:var(--ok)}
button{font:600 12.5px var(--ui);background:transparent;color:var(--cyan);border:1px solid var(--cyan);border-radius:3px;padding:6px 12px;cursor:pointer}
button:hover{background:rgba(25,243,255,.1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
.btn-disabled,button:disabled{color:#4a5866;border-color:#2a3644;cursor:not-allowed;background:none}
.cfg{padding:10px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line)}
.cfg input{flex:1 1 220px;background:#05070a;border:1px solid var(--line);border-radius:3px;color:var(--text);font:12.5px var(--mono);padding:6px 8px}
.cmd{display:flex;border-top:1px solid var(--line)}
.cmd span{padding:8px 0 8px 12px;color:var(--mag);font:13px var(--mono)}
.cmd input{flex:1;background:none;border:0;color:var(--text);font:13px var(--mono);padding:8px}
.wide{overflow-x:auto}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}#hub-log{height:280px}}
@media (prefers-reduced-motion:no-preference){.tile b{transition:color .2s}}
</style>
</head>
<body>
<header>
  <h1>CORNY<span>//</span>STUDIO</h1>
  <span id="b-role" class="badge guest">GUEST</span>
  <span id="b-mode" class="badge sim">SIMULATED FEED</span>
  <span class="badge">Roblox Hub</span>
  <span style="margin-left:auto;display:flex;gap:14px"><a href="panel.html" style="color:var(--dim);font:12px var(--mono)">back to console</a><a href="panel.html" onclick="try{sessionStorage.removeItem('corny_role');sessionStorage.removeItem('corny_key')}catch(e){}" style="color:var(--dim);font:12px var(--mono)">switch role</a></span>
</header>

<section class="grid" aria-label="Live metrics">
  <div class="tile"><b id="m-ccu">0</b><small>Players online</small></div>
  <div class="tile"><b id="m-net">0</b><small>Net coins (minted − sunk)</small></div>
  <div class="tile"><b id="m-buy">0</b><small>Purchases this session</small></div>
  <div class="tile"><b id="m-rank">0</b><small>Group rank changes</small></div>
</section>

<section class="cols">
  <div class="box">
    <h2><span>Telemetry terminal</span><span id="c-rate" class="st">0 ev/min</span></h2>
    <pre id="hub-log" aria-live="polite"></pre>
    <div class="cmd"><span>&gt;</span><input id="cmd" placeholder="guest: read-only. admin: type help" autocomplete="off"></div>
    <div class="cfg" id="cfg">
      <input id="relay" placeholder="Relay URL (admin only), e.g. https://corny-relay.yourname.workers.dev">
      <button id="relay-save">Connect relay</button>
      <button id="relay-clear">Use simulation</button>
    </div>
  </div>

  <div class="box">
    <h2><span>Automation pipelines</span><span class="st">repo workers</span></h2>
    <div class="agents wide" id="agents"></div>
  </div>
</section>

<script src="hub.js"></script>
<script src="space-bg.js"></script>
</body>
</html>
